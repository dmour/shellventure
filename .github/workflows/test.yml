name: test
on: [push, pull_request]
jobs:
  solve-all-rooms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - run: pip install rich
      - run: python3 tests/solve_all.py

  solve-all-rooms-as-root:   # phones (Termux + proot) play as root: root can read any file, so checks must use permission bits
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git jq
      - uses: actions/checkout@v4
      - run: pip install rich
      - run: python3 tests/solve_all.py
